[package]
name = "routine-launcher"
# Kept in step with `package.json`, `package-lock.json` and
# `src-tauri/tauri.conf.json` by `npm run version:set` — see the "Versioning"
# section of README.md. The number the *installer* is stamped with comes from
# `tauri.conf.json`; this one is the Rust crate's, and they are only ever the
# same because that script writes both.
version = "0.1.4"
description = "Routine launcher and productivity hub"
authors = ["zhongxuen"]
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "routine_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what makes `WebviewWindowBuilder::transparent`
# exist on every platform rather than only off macOS — section 83's
# widget opacity is painted by the webview onto a transparent window,
# because Tauri has no cross-platform window alpha. Paired with
# `macOSPrivateApi` in `tauri.conf.json`, which is where the runtime
# reads it from.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Deleting a large file (development-plan.md sections 41, 67) sends it to the
# Recycle Bin rather than unlinking it, so the confirmation dialog can promise
# the file is recoverable and mean it.
trash = "5"
sha2 = "0.10"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
# Section 85's update strategy. Desktop-only for the same reason its two
# neighbours are: there is no `Run` key, no global accelerator and no
# installer to replace on a phone. It brings its own HTTPS client, which is
# the only network code in this process — see `services::updates` for what it
# is allowed to talk to and `services::logging` for the promise that survives
# it.
tauri-plugin-updater = "2"

